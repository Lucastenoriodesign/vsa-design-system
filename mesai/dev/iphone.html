<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesaí ao vivo · iPhone</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#1b1a19;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:13px -apple-system,BlinkMacSystemFont,Inter,sans-serif;color:#cfc8bf;overflow:hidden}
.phone{position:relative;width:calc(var(--h)*0.4836);height:var(--h);border-radius:calc(var(--h)*0.072);background:#0c0c0c;padding:calc(var(--h)*0.0135);box-shadow:0 0 0 2px #3a3a3a,0 30px 80px #000a;--h:min(88vh,932px)}
.phone::before{content:"";position:absolute;inset:-4px;border-radius:inherit;border:4px solid #e87558;opacity:.9;pointer-events:none}
.screen{position:relative;width:100%;height:100%;border-radius:calc(var(--h)*0.06);overflow:hidden;background:#fff}
.island{position:absolute;top:calc(var(--h)*0.012);left:50%;transform:translateX(-50%);width:32%;height:calc(var(--h)*0.036);background:#000;border-radius:99px;z-index:3}
iframe{position:absolute;inset:0;border:0;width:430px;height:932px;transform-origin:0 0;transform:scale(var(--s))}
.bar{display:flex;gap:8px;align-items:center}
.bar button,.bar select{background:#2a2826;color:#f3ede6;border:1px solid #444;border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:#5e9e6e;display:inline-block;margin-right:6px}
.off .dot{background:#c0392b}
</style></head><body>
<div class="phone" id="phone"><div class="screen"><div class="island"></div><iframe id="app" src="http://localhost:8124/" title="Mesaí"></iframe></div></div>
<div class="bar" id="bar"><span id="st"><span class="dot"></span>ao vivo · localhost:8124</span>
<select id="dev" title="Modelo"><option value="430x932">iPhone 17 Pro Max</option><option value="393x852" selected>iPhone 17 Pro</option><option value="375x667">iPhone SE</option></select>
<button id="re">Recarregar</button><button id="reset" title="Mostra as boas-vindas de novo">Primeiro acesso</button></div>
<script>
var f=document.getElementById('app'),ph=document.getElementById('phone');
function fit(){var d=document.getElementById('dev').value.split('x'),w=+d[0],h=+d[1];
 var H=Math.min(innerHeight*0.86,932),r=w/h;ph.style.setProperty('--h',H+'px');ph.style.width=(H*r+H*0.027)+'px';
 var inner=ph.querySelector('.screen').clientWidth;f.style.width=w+'px';f.style.height=h+'px';f.style.setProperty('--s',inner/w)}
addEventListener('resize',fit);document.getElementById('dev').onchange=fit;fit();
document.getElementById('re').onclick=function(){f.src=f.src};
document.getElementById('reset').onclick=function(){f.src='http://localhost:8124/?primeiro-acesso=1'};
// avisa se o servidor local caiu
setInterval(function(){fetch('http://localhost:8124/index.html',{cache:'no-store',mode:'no-cors'}).then(function(){document.getElementById('bar').classList.remove('off');document.getElementById('st').innerHTML='<span class="dot"></span>ao vivo · localhost:8124'}).catch(function(){document.getElementById('bar').classList.add('off');document.getElementById('st').innerHTML='<span class="dot"></span>servidor parado — peça ao Claude Code: "rode o modo ao vivo"'})},4000);
</script></body></html>
