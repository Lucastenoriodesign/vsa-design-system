<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="IA Chinesa encontrando produtos e fornecedores">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A3C"/><stop offset=".5" stop-color="#FF6A1F"/><stop offset="1" stop-color="#EE4D2D"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF6A1F" stop-opacity=".55"/><stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/></radialGradient>
</defs>
<rect width="480" height="300" rx="20" fill="#150E0A"/>
<circle cx="380" cy="60" r="170" fill="url(#glow)"/>
<circle cx="60" cy="280" r="130" fill="url(#glow)" opacity=".6"/>
<!-- janela -->
<rect x="24" y="24" width="432" height="252" rx="16" fill="#0A0705" stroke="#3a2418"/>
<circle cx="44" cy="44" r="4" fill="#EE4D2D"/><circle cx="58" cy="44" r="4" fill="#FFB347"/><circle cx="72" cy="44" r="4" fill="#3DDC84"/>
<text x="240" y="48" fill="#A8958A" font-family="monospace" font-size="11" text-anchor="middle">IA CHINESA · 智能</text>
<!-- pergunta -->
<rect x="170" y="66" width="270" height="34" rx="17" fill="url(#g)"/>
<text x="188" y="88" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Ache um produto que vende todo dia</text>
<!-- resposta -->
<rect x="40" y="112" width="300" height="52" rx="14" fill="#1d120c" stroke="#3a2418"/>
<text x="56" y="133" fill="#FFB347" font-family="monospace" font-size="11">✓ 3 NICHOS OCULTOS ENCONTRADOS</text>
<text x="56" y="151" fill="#EBDCD3" font-family="Arial,sans-serif" font-size="12">Alta procura · baixa concorrência</text>
<!-- cards de produto -->
<g font-family="Arial,sans-serif">
<rect x="40" y="178" width="124" height="82" rx="12" fill="#1d120c" stroke="#3a2418"/>
<rect x="50" y="188" width="104" height="34" rx="8" fill="url(#g)" opacity=".85"/>
<text x="102" y="212" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">+312%</text>
<text x="50" y="240" fill="#fff" font-size="11" font-weight="700">Nicho #1</text>
<text x="50" y="253" fill="#3DDC84" font-size="10">Fornecedor verificado ✓</text>
<rect x="178" y="178" width="124" height="82" rx="12" fill="#1d120c" stroke="#3a2418"/>
<rect x="188" y="188" width="104" height="34" rx="8" fill="url(#g)" opacity=".6"/>
<text x="240" y="212" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">+187%</text>
<text x="188" y="240" fill="#fff" font-size="11" font-weight="700">Nicho #2</text>
<text x="188" y="253" fill="#3DDC84" font-size="10">Fornecedor verificado ✓</text>
<rect x="316" y="178" width="124" height="82" rx="12" fill="#1d120c" stroke="#3a2418"/>
<rect x="326" y="188" width="104" height="34" rx="8" fill="url(#g)" opacity=".4"/>
<text x="378" y="212" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">+96%</text>
<text x="326" y="240" fill="#fff" font-size="11" font-weight="700">Nicho #3</text>
<text x="326" y="253" fill="#3DDC84" font-size="10">Fornecedor verificado ✓</text>
</g>
<!-- selo IA -->
<circle cx="404" cy="138" r="26" fill="url(#g)"/>
<text x="404" y="146" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">AI</text>
</svg>
